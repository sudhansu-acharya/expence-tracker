<!DOCTYPE html>
<html lang="en" data-theme="light" data-accent="emerald">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d9488" />
  <meta name="description" content="CashewFlow — 100% Free, Offline-First, AES-256-GCM Encrypted Expense & Budget Tracker PWA for Android, Windows, and macOS." />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://www.googleapis.com https://accounts.google.com;" />
  <title>CashewFlow — Offline Encrypted Expense Tracker</title>
  <link rel="manifest" href="./manifest.json?v=2" />
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="./assets/icons/icon-512.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="./css/tokens.css" />
  <link rel="stylesheet" href="./css/layout.css" />
  <link rel="stylesheet" href="./css/components.css" />
</head>
<body>
  <!-- Offline Login / Vault Setup Gate -->
  <section class="auth-overlay" id="authOverlay" aria-label="Vault Authentication"></section>

  <!-- Main Authenticated App Shell -->
  <div class="app-shell hidden" id="appShell">
    <aside class="desktop-rail" id="desktopRail" aria-label="Desktop Navigation"></aside>

    <div class="app-main">
      <header class="app-header">
        <div class="header-title-wrap">
          <h1 id="pageTitle">Dashboard</h1>
          <div class="header-sub" id="pageSub">Offline Encrypted Vault</div>
        </div>
        <div class="header-actions">
          <button class="btn-soft hidden" id="installPwaBtn" data-action="install-pwa">Install App</button>
          <button class="icon-btn" id="hdrHideBtn" data-action="toggle-hide" title="Hide Amounts (H)"></button>
          <button class="icon-btn" id="hdrLockBtn" data-action="lock-vault" title="Lock Vault (L)"></button>
        </div>
      </header>

      <main class="app-scroll">
        <div class="view-container" id="viewContainer"></div>
      </main>

      <button class="fab" id="fabAddBtn" data-action="open-tx-modal" title="Add Transaction (N)">
        <span id="fabIcon"></span>
        <span class="fab-label">Add Expense</span>
      </button>

      <nav class="bottom-nav" id="mobileNav" aria-label="Mobile Navigation"></nav>
    </div>
  </div>

  <!-- Dynamic Modal Container -->
  <div class="modal-backdrop hidden" id="modalBackdrop"></div>

  <!-- Toast Notification -->
  <div class="toast hidden" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
